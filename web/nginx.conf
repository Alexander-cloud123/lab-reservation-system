# =====================================================================
# 前端容器 Nginx 站点配置（挂载为 /etc/nginx/conf.d/default.conf）
# 职责：托管 Vite 构建产物 + 把 /api 反代到后端容器（服务名 api:8080）
# =====================================================================

# 登录/注册按来源 IP 限流：10 次/分钟，允许突发 9 次（合计 10 次立即放行，第 11 次 429）。
# 后端已有按账号的 5 次失败锁定，这里补的是「按 IP 防批量撞库/批量注册」。
limit_req_zone $binary_remote_addr zone=auth_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_register_limit:10m rate=10r/m;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 不暴露 nginx 版本号
    server_tokens off;

    # 限流触发时返回 429（默认 503 会被前端当成服务异常）
    limit_req_status 429;

    # 基础安全响应头（always 保证 4xx/5xx 也带）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Excel 导出等响应体积较小，20m 足够且避免默认 1m 误伤
    client_max_body_size 20m;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带 hash 的构建产物可长缓存
    # 注意：location 内出现 add_header 会覆盖 server 级安全头，需在此重复声明
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files  $uri =404;
    }

    # 入口页不缓存，保证发布后立即生效（同样需重复安全头）
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 登录 / 注册单独限流（精确匹配优先于下面的 /api/ 前缀）
    location = /api/user/login {
        limit_req zone=auth_login_limit burst=9 nodelay;
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location = /api/user/register {
        limit_req zone=auth_register_limit burst=9 nodelay;
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # 后端接口：路径原样转发（/api/user/login -> api:8080/api/user/login）
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # AI 问答 SSE（/api/ai/chat?stream=true）必须关闭缓冲，否则打字机效果被整段缓冲后才输出
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vue Router history 模式回退：刷新任意前端路由都返回入口页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
