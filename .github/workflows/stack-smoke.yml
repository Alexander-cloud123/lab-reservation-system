# 全栈冒烟：真实起 MySQL / Redis / 后端 / 前端，跑接口冒烟与浏览器 E2E
#
# 与 server-ci.yml 的分工：
#   server-ci.yml    —— JVM 层：单测 + 集成测试（不起前端，最快给出红灯）
#   stack-smoke.yml  —— 全栈层：jar 起来后跑 41 项接口冒烟（smoke）与 120 项 Playwright E2E（e2e）
# 两个 job 各自持有独立的 MySQL / Redis service 容器，互不污染数据：
#   smoke 会写一条预约并登出 / 重置密码（token_version 自增），E2E 依赖干净基线计数，不能共用库。
name: Stack Smoke & E2E

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'web/**'
      - 'database/init_db.sql'
      - '.github/workflows/stack-smoke.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'database/init_db.sql'
      - '.github/workflows/stack-smoke.yml'

concurrency:
  group: stack-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- 1) 后端接口冒烟（41 项） ----------
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_ENABLE: 'true'
      AI_ENABLE: 'false'
      JWT_SECRET: ci-only-secret-not-for-production
      MYBATIS_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Init database
        run: mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -uroot -proot < database/init_db.sql

      - name: Package backend jar
        run: mvn -B -f server/pom.xml -DskipTests package

      - name: Start backend
        run: |
          java -jar server/target/reservation-server-*.jar > /tmp/api.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:8080/api/user/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123","role":1}'; then
              echo "backend ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start in 90s"
          tail -n 120 /tmp/api.log
          exit 1

      - name: API smoke (41 checks)
        run: pwsh -NoProfile -File server/scripts/smoke.ps1

      - name: Backend log on failure
        if: failure()
        run: tail -n 200 /tmp/api.log || true

  # ---------- 2) 浏览器 E2E（Chromium 全量 120 项） ----------
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_ENABLE: 'true'
      AI_ENABLE: 'false'
      JWT_SECRET: ci-only-secret-not-for-production
      MYBATIS_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Init database
        working-directory: .
        run: mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -uroot -proot < database/init_db.sql

      - name: Package backend jar
        working-directory: .
        run: mvn -B -f server/pom.xml -DskipTests package

      - name: Start backend
        working-directory: .
        run: |
          java -jar server/target/reservation-server-*.jar > /tmp/api.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:8080/api/user/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123","role":1}'; then
              echo "backend ready after ${i} tries"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start in 90s"
          tail -n 120 /tmp/api.log
          exit 1

      - name: Install web dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E (120 cases)
        run: npm run test:e2e
        env:
          E2E_API_PORT: '8080'
          E2E_WEB_PORT: '5173'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/e2e-report
          retention-days: 7

      - name: Backend log on failure
        if: failure()
        working-directory: .
        run: tail -n 200 /tmp/api.log || true
