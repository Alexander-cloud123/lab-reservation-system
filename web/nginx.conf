# =====================================================================
# 前端容器 Nginx 站点配置（挂载为 /etc/nginx/conf.d/default.conf）
# 职责：托管 Vite 构建产物 + 把 /api 反代到后端容器（服务名 api:8080）
# =====================================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Excel 导出等响应体积较小，20m 足够且避免默认 1m 误伤
    client_max_body_size 20m;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # 入口页不缓存，保证发布后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 后端接口：路径原样转发（/api/user/login -> api:8080/api/user/login）
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # AI 问答 SSE（/api/ai/chat?stream=true）必须关闭缓冲，否则打字机效果被整段缓冲后才输出
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vue Router history 模式回退：刷新任意前端路由都返回入口页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
