server:
  port: 8080

spring:
  application:
    name: reservation-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

knife4j:
  enable: true
  openapi:
    title: 教室预约系统接口文档
    version: 3.1
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources: com.example.reservation.controller

# ===== AI 模块配置（第 7 轮启用，密钥仅从环境变量读取，禁止硬编码）=====
ai:
  enable: false              # 总开关，默认关闭，不影响核心系统
  base-url: https://apihub.agnes-ai.cn/v1
  api-key: ${AGNES_API_KEY:}  # 密钥从环境变量读取，禁止硬编码
  model: agnes-2.0-flash
  timeout-seconds: 3
  rpm-limit: 20

# ===== 应用自定义配置 =====
app:
  jwt:
    # Token 签名密钥：默认值仅供本地开发，生产/演示环境必须通过环境变量 JWT_SECRET 注入
    secret: ${JWT_SECRET:reservation-system-jwt-secret-2026}
    expire-hours: 24




