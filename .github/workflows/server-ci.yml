# 后端构建与单测（相关变更自动触发，也支持手动重跑）
# MySQL / Redis service 与种子数据由本工作流准备，测试失败必须修复，不能以冻结期为由跳过质量门禁。
name: Server CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'database/init_db.sql'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'database/init_db.sql'
      - '.github/workflows/server-ci.yml'

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/reservation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_ENABLE: 'true'
      AI_ENABLE: 'false'
      JWT_SECRET: ci-only-secret-not-for-production
      MYBATIS_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Init database
        run: mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -uroot -proot < database/init_db.sql

      - name: Build and test
        run: mvn -B -f server/pom.xml test

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco
          retention-days: 7
